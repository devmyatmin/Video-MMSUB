name: Create subtitles from MP4

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job ID generated by Video MMSUB
        required: true
        type: string
      video_url:
        description: Direct MP4 video URL
        required: true
        type: string
      mode:
        description: Select the output
        required: true
        type: choice
        options:
          - transcribe
          - burn
        default: transcribe
      srt_url:
        description: SRT URL required only for burn mode
        required: false
        type: string

permissions:
  contents: write
concurrency:
  group: video-mmsub-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-core fonts-noto-extra
          fc-cache -f -v
          fc-match "Noto Sans Myanmar"
      - name: Install Python dependencies
        run: pip install -r requirements.txt 'yt-dlp[default,curl-cffi]'
      - name: Validate URLs and mode
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          SRT_URL: ${{ inputs.srt_url }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          mode = os.environ.get("MODE", "")
          if mode not in {"transcribe", "burn"}:
              raise SystemExit("MODE must be transcribe or burn")
          for name in ("VIDEO_URL", "SRT_URL"):
              value = os.environ.get(name, "").strip()
              if name == "SRT_URL" and mode != "burn":
                  continue
              if not value and name == "SRT_URL" and mode != "burn":
                  continue
              if not value:
                  raise SystemExit(f"{name} is required for mode={mode}")
              u = urlparse(value)
              if u.scheme not in {"http", "https"} or not u.hostname or u.username or u.password:
                  raise SystemExit(f"{name} must be a valid http/https URL")
              if name == "VIDEO_URL" and not u.path.lower().endswith(".mp4"):
                  raise SystemExit("VIDEO_URL must point directly to an .mp4 file")
          PY
      - name: Download MP4 video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$VIDEO_URL" --output input-video.mp4
          test -s input-video.mp4
          SIZE="$(stat -c%s input-video.mp4)"
          MAX=$((10 * 1000 * 1000 * 1000))
          echo "Downloaded video size: $SIZE bytes"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "Input video exceeds the 10 GB limit."
            exit 1
          fi
      - name: Transcribe to source-language SRT
        if: ${{ inputs.mode == 'transcribe' }}
        run: |
          python scripts/process_video.py transcribe input-video.mp4 output.srt
          test -s output.srt
      - name: Delete temporary video after transcription
        if: ${{ inputs.mode == 'transcribe' }}
        run: rm -f input-video.mp4 audio.wav
      - name: Download supplied SRT
        if: ${{ inputs.mode == 'burn' }}
        env:
          SRT_URL: ${{ inputs.srt_url }}
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "$SRT_URL" --output input.srt
          test -s input.srt
          grep -q -- '-->' input.srt
      - name: Burn supplied SRT into video with gold size-30 subtitles
        if: ${{ inputs.mode == 'burn' }}
        run: |
          python scripts/process_video.py burn-srt input-video.mp4 input.srt output.mp4
          test -s output.mp4
      - name: Publish output as a downloadable release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_ID: ${{ inputs.job_id }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "transcribe" ]; then
            gh release create "mmsub-$JOB_ID" output.srt --repo "$GH_REPO" --title "Video MMSUB $JOB_ID" --notes "Source-language speech transcription as SRT. Temporary video is not included."
          elif [ "$MODE" = "burn" ]; then
            gh release create "mmsub-$JOB_ID" output.mp4 --repo "$GH_REPO" --title "Video MMSUB $JOB_ID" --notes "MP4 with gold size-30 subtitles burned into video."
          fi
      - name: Publish failure marker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          gh release create "mmsub-$JOB_ID" --repo "$GH_REPO" --title "Video MMSUB $JOB_ID - failed" --notes "PROCESSING_FAILED: Check GitHub Actions logs." || true
