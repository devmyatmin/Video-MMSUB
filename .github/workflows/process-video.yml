name: Process Video to Burmese Subtitles

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job ID generated by Video MMSUB
        required: true
        type: string
      video_url:
        description: Direct video URL or supported website video URL
        required: true
        type: string
      callback_url:
        description: App callback endpoint base URL
        required: true
        type: string
      callback_token:
        description: Per-job callback secret
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: video-mmsub-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra curl
      - name: Install Python dependencies
        run: pip install -r requirements.txt yt-dlp
      - name: Validate and download video URL
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ["VIDEO_URL"])
          if u.scheme not in {"http", "https"} or not u.hostname:
              raise SystemExit("Enter a valid http:// or https:// video URL")
          if u.username or u.password:
              raise SystemExit("URLs containing embedded credentials are not accepted")
          PY
          yt-dlp --no-playlist --force-overwrites -f "bv*+ba/b" --merge-output-format mp4 -o "input-video.%(ext)s" "$VIDEO_URL"
          if [ -f input-video.mp4 ]; then
            echo "Video downloaded as input-video.mp4"
          else
            FILE="$(find . -maxdepth 1 -type f -name 'input-video.*' -print -quit)"
            if [ -z "$FILE" ]; then
              echo "No downloaded video file found"
              exit 1
            fi
            mv "$FILE" input-video.mp4
          fi
      - name: Transcribe, translate and burn subtitles
        run: python scripts/process_video.py input-video.mp4 output.mp4
      - name: Send output back to the phone server
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          curl --fail --show-error --retry 2 --max-time 3600 \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -F "file=@output.mp4;type=video/mp4" \
            "$CALLBACK_URL/complete"
      - name: Notify app if processing failed
        if: failure()
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
        run: |
          curl --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"error":"GitHub Actions processing failed. Check the Actions run logs."}' \
            "$CALLBACK_URL/failed" || true
