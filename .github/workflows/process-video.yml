name: Video to SRT or Add Styled SRT Track to MKV

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job ID generated by Video MMSUB
        required: true
        type: string
      video_url:
        description: Video URL
        required: true
        type: string
      srt_url:
        description: Optional SRT URL; when supplied add it as a selectable subtitle track
        required: false
        type: string

permissions:
  contents: write
concurrency:
  group: video-mmsub-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements.txt yt-dlp
      - name: Validate URLs
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          SRT_URL: ${{ inputs.srt_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          for name in ("VIDEO_URL", "SRT_URL"):
              value = os.environ.get(name, "").strip()
              if not value and name == "SRT_URL":
                  continue
              u = urlparse(value)
              if u.scheme not in {"http", "https"} or not u.hostname or u.username or u.password:
                  raise SystemExit(f"{name} must be a valid http/https URL")
          PY
      - name: Download video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          yt-dlp --no-playlist --force-overwrites -f "bv*+ba/b" --merge-output-format mp4 -o "input-video.%(ext)s" "$VIDEO_URL"
          if [ ! -f input-video.mp4 ]; then
            FILE="$(find . -maxdepth 1 -type f -name 'input-video.*' -print -quit)"
            if [ -z "$FILE" ]; then echo "No downloaded video found"; exit 1; fi
            mv "$FILE" input-video.mp4
          fi
      - name: Transcribe to source-language SRT
        if: ${{ inputs.srt_url == '' }}
        run: |
          python scripts/process_video.py transcribe input-video.mp4 output.srt
          test -s output.srt
      - name: Delete temporary video after SRT-only transcription
        if: ${{ inputs.srt_url == '' }}
        run: rm -f input-video.mp4 audio.wav
      - name: Download supplied SRT
        if: ${{ inputs.srt_url != '' }}
        env:
          SRT_URL: ${{ inputs.srt_url }}
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "$SRT_URL" --output input.srt
          test -s input.srt
          grep -q -- '-->' input.srt
      - name: Add supplied SRT as a styled selectable track in MKV
        if: ${{ inputs.srt_url != '' }}
        run: |
          python scripts/process_video.py add-srt input-video.mp4 input.srt output.mkv
          test -s output.mkv
      - name: Publish output
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_ID: ${{ inputs.job_id }}
          SRT_URL: ${{ inputs.srt_url }}
        run: |
          if [ -n "$SRT_URL" ]; then
            gh release create "mmsub-$JOB_ID" output.mkv --repo "$GH_REPO" --title "Video MMSUB $JOB_ID" --notes "MKV with gold, enlarged, slightly raised selectable ASS subtitles. Public asset download."
          else
            gh release create "mmsub-$JOB_ID" output.srt --repo "$GH_REPO" --title "Video MMSUB $JOB_ID" --notes "Source-language speech transcription as SRT. Temporary video is not included."
          fi
      - name: Publish failure marker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          gh release create "mmsub-$JOB_ID" --repo "$GH_REPO" --title "Video MMSUB $JOB_ID - failed" --notes "PROCESSING_FAILED: Check GitHub Actions logs." || true
